name: Gold SMC Signal

on:
  schedule:
    # รันทุก ๆ 1 ชั่วโมง เฉพาะวันจันทร์-ศุกร์ (UTC)
    - cron: '0 * * * 1-5'
    # รันพิเศษตอน 7 โมงเช้าไทย (00:00 UTC) เฉพาะวันจันทร์-ศุกร์
    - cron: '0 0 * * 1-5'
  workflow_dispatch:       # ยังสามารถกด Run เองได้เสมอ

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Signal Bot
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python signal_bot.py
      - name: Commit and push pending orders (state)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pending_orders.json
          git diff --staged --quiet || (git commit -m "Update pending orders [skip ci]" && git push)