name: Gold Signal System

on:
  schedule:
    # รันทุก 15 นาที เฉพาะวันจันทร์-ศุกร์
    - cron: '*/15 * * * 1-5'
    # แจ้งเตือน 7 โมงเช้าไทย (00:00 UTC) วันจันทร์-ศุกร์
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

jobs:
  gold_signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Gold SMC+Ichimoku Signal
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python signal_bot.py
      - name: Commit gold state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pending_orders.json
          git diff --staged --quiet || (git commit -m "Update gold state [skip ci]" && git push)