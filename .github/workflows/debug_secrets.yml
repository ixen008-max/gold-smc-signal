name: Debug Secrets

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug LINE Token
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -z "$LINE_TOKEN" ]; then
            echo "LINE_TOKEN is EMPTY"
          else
            echo "LINE_TOKEN is set, length: ${#LINE_TOKEN}"
          fi

      - name: Debug LINE User ID
        env:
          LINE_UID: ${{ secrets.LINE_USER_ID }}
        run: |
          if [ -z "$LINE_UID" ]; then
            echo "LINE_UID is EMPTY"
          else
            echo "LINE_UID is set, length: ${#LINE_UID}"
          fi